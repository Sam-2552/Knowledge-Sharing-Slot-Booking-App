services:
  nginx:
    image: nginx:1.25
    container_name: ksp-nginx
    depends_on:
      - app
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - ksp-net

  redis:
    image: redis:7
    container_name: ksp-redis
    networks:
      - ksp-net
