<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Knowledge Sharing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12">
                <h1 class="text-center my-5 fw-bold">Knowledge Sharing Portal</h1>
            </div>
            <div class="col-md-5">
                <div class="card shadow-sm mt-2">
                    <div class="card-body p-4">
                        <h2 class="mb-4 text-center">Login</h2>
                        {% if error %}
                        <div class="alert alert-danger" role="alert">
                            {{ error }}
                        </div>
                        {% endif %}
                        <form method="POST" action="/login">
                            <input type="hidden" name="next" value="{{ next or '' }}">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" name="email" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="mb-3 text-end">
                                <a href="/forgot-password" class="link-secondary small">Forgot Password?</a>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success">Login</button>
                            </div>
                        </form>
                        <hr class="my-3">
                        <div class="d-grid gap-2">
                            <a href="/auth/oauth/login" class="btn btn-outline-primary">Sign in with corporate SSO</a>
                            <a href="/auth/magic-link" class="btn btn-outline-secondary btn-sm">Email me a sign-in link</a>
                        </div>
                        <div class="mt-3 text-center">
                            <span>Don't have an account?</span>
                            <a href="/signup">Sign Up</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
