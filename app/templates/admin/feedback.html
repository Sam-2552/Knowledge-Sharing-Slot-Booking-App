<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Feedback & Points | Knowledge Sharing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light" style="min-height: 100vh;">
    <div class="container py-5">
        <div class="card mx-auto" style="max-width: 500px;">
            <div class="card-body">
                <h4 class="card-title mb-3">Add Feedback & Points</h4>
                <div class="alert alert-warning" role="alert">
                    <strong>Note:</strong> Once submitted, feedback and points cannot be changed. Please confirm before proceeding.
                </div>
                <div class="mb-3">
                    <strong>Topic:</strong> {{ activity['topic'] or '-' }}<br>
                    <strong>Agenda:</strong> {{ activity['agenda'] or '-' }}<br>
                    <strong>Date:</strong> {{ activity['created_at'][:10] }}<br>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label for="feedback" class="form-label">Feedback <span class="text-danger">*</span></label>
                        <textarea name="feedback" id="feedback" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="points" class="form-label">Points <span class="text-danger">*</span></label>
                        <input type="number" name="points" id="points" class="form-control" min="0" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Submit</button>
                </form>
                <a href="/my-activity" class="btn btn-link mt-3">Back to Activity</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
