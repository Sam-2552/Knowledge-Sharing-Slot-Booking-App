{% extends "base.html" %}
{% block title %}Edit Slot | Knowledge Sharing Portal{% endblock %}

{% block tabs %}
<div class="container mt-3">
    <ul class="nav nav-tabs">
        <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/my-activity">My Activity</a></li>
        <li class="nav-item"><a class="nav-link" href="/leaderboard">Leaderboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/profile">Profile</a></li>
    </ul>
</div>
{% endblock %}

{% block content %}
<h3 class="mb-3">Edit slot ({{ slot['date'] }} {{ slot['time'] }})</h3>
<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Topic</label>
                <input type="text" name="topic" class="form-control" value="{{ slot['topic'] or '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Agenda</label>
                <textarea name="agenda" rows="3" class="form-control">{{ slot['agenda'] or '' }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Link</label>
                <input type="url" name="link" class="form-control" value="{{ slot['link'] or '' }}">
            </div>
            <button class="btn btn-success">Save</button>
            <a href="/dashboard" class="btn btn-link">Back</a>
        </form>
    </div>
</div>
{% endblock %}
