<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard | Knowledge Sharing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light" style="min-height: 100vh;">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard">Knowledge Sharing Portal</a>
            <div class="d-flex">
                <a href="/logout" class="btn btn-outline-secondary">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container mt-3">
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link" href="/dashboard">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/my-activity">My Activity</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="/leaderboard">Leaderboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/profile">Profile</a>
            </li>
        </ul>
    </div>
    <div class="container py-5">
        <h2 class="mb-4">Leaderboard</h2>
        <div class="table-responsive">
            <table class="table table-bordered align-middle text-center bg-white">
                <thead class="table-light">
                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Total Points</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in leaderboard %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ user['name'] }}</td>
                        <td>{{ user['total_points'] }}</td>
                    </tr>
                    {% else %}
                    <tr><td colspan="3" class="text-muted">No users found.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <a href="/dashboard" class="btn btn-primary mt-3">Back to Dashboard</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
