worker_processes  1;

events {
    worker_connections  1024;
}

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=ksp_cache:10m
                     max_size=100m inactive=60m use_temp_path=off;

    upstream ksp_app {
        # Connection pooling against gunicorn; keep tuned for warm latency.
        server app:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            proxy_pass http://ksp_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache ksp_cache;
            proxy_cache_valid 200 302 60m;
        }

        # Marketing surface — caches the landing pages so we don't burn cycles
        # rendering them per visitor.
        location ~ ^/(about|team|help)$ {
            proxy_pass http://ksp_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache ksp_cache;
            proxy_cache_valid 200 302 60s;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location / {
            proxy_pass http://ksp_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }
}
