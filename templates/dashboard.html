<html><head>

    <title>Stitch Design</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style type="text/tailwindcss">
          :root {
            --primary-color: #dce8f3;
            --text-primary: #101518;
            --text-secondary: #5c748a;
            --background-primary: #f7f9fc;
            --background-secondary: #ffffff;
            --border-color: #eaedf1;
          }
          .slot-available {
            background-color: #e6f7f0;color: #0c6649;
            border: 1px solid #a2e5c8;
          }
          .slot-past {
            background-color: #f1f3f6;color: #5c748a;
            border: 1px solid #d4dce2;
          }
          .slot-draft {
            background-color: #fff3e0;color: #996a00;
            border: 1px solid #ffd699;
          }
          .slot-confirmed {
            background-color: #e3f2fd;color: #1976d2;
            border: 1px solid #a0cfff;
          }
          .slot-rejected {
            background-color: #ffebee;color: #c62828;
            border: 1px solid #f7a0a0;
          }
          .active-filter {
            background-color: var(--primary-color) !important;
            color: var(--text-primary) !important;
            font-weight: 600;
          }
        </style>
    </head>
    <body class="bg-gray-50" style='font-family: "Plus Jakarta Sans", "Noto Sans", sans-serif;'>
    <div class="relative flex size-full min-h-screen flex-col group/design-root overflow-x-hidden bg-[var(--background-primary)]">
    <div class="layout-container flex h-full grow flex-col">
    <header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[var(--border-color)] px-6 md:px-10 py-4">

    </div>
    <h2 class="text-[var(--text-primary)] text-xl font-bold leading-tight tracking-[-0.015em]">Workshop Scheduler</h2>
    </div>
    <nav class="hidden md:flex items-center gap-8">
    <a class="text-[var(--text-primary)] text-sm font-medium leading-normal hover:text-[var(--primary-color)] transition-colors" href="#">Dashboard</a>
    <a class="text-[var(--text-primary)] text-sm font-medium leading-normal hover:text-[var(--primary-color)] transition-colors" href="#">Bookings</a>
    <a class="text-[var(--text-primary)] text-sm font-medium leading-normal hover:text-[var(--primary-color)] transition-colors" href="#">Workshops</a>
    <a class="text-[var(--text-primary)] text-sm font-medium leading-normal hover:text-[var(--primary-color)] transition-colors" href="#">Settings</a>
    </nav>
    <div class="flex items-center gap-4">
    <button class="md:hidden text-[var(--text-primary)]">
    <span class="material-symbols-outlined">menu</span>
    </button>
    <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10 border-2 border-white shadow-sm" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuB6kjNa4VSi21PDaToba7AiAOXqJTv7tnojvqyYVdk0IjUItpE3kJvomQ-IMwCfBjJgCkaOSvrgz_mao0EeuNMYnmNvBIf4A6PTITIaJtV33SF55VEmBgse0PFrf1SbZwSBeRlOImkU2z2_1eisDUw0BhcxSk0kmfGzCWO_7lP7TxTX7gLDbe9MkjMxHjn4h81uJVQ1uvROmnfb3XT0vlLawXShsNA31ygh8n2hw7hDbaY8CNJAssPxq_sTRZMOQBK5JtnZNd41SQ1O");'></div>
    </div>
    </header>
    <main class="flex-1 px-4 sm:px-6 md:px-10 py-8 bg-[var(--background-secondary)]">
    <div class="max-w-7xl mx-auto">
    <div class="mb-8">
    <h1 class="text-[var(--text-primary)] text-3xl font-bold leading-tight tracking-tight">Workshop Schedule</h1>
    <p class="text-[var(--text-secondary)] text-base font-normal">View and manage workshop slots for the week.</p>
    </div>
    <div class="mb-6 flex flex-col sm:flex-row gap-4 items-center justify-between">
    <div class="flex items-center rounded-lg bg-[var(--border-color)] p-1">
    <button class="px-4 py-2 rounded-md text-sm font-medium text-[var(--text-secondary)] hover:bg-white hover:text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] transition-all">Day</button>
    <button class="px-4 py-2 rounded-md text-sm font-medium text-[var(--text-primary)] bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] transition-all">Week</button>
    </div>
    <div class="flex items-center gap-2">
    <button class="px-4 py-2 rounded-lg text-sm font-medium text-[var(--text-secondary)] bg-[var(--border-color)] hover:bg-gray-200 active-filter">All Bookings</button>
    <button class="px-4 py-2 rounded-lg text-sm font-medium text-[var(--text-secondary)] bg-[var(--border-color)] hover:bg-gray-200">Your Bookings Only</button>
    </div>
    </div>
    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 mb-8">
    <div class="xl:col-span-1 bg-white p-4 rounded-xl border border-[var(--border-color)] shadow-sm">
    <div class="flex items-center justify-between mb-4">
    <button class="p-2 rounded-full hover:bg-gray-100 text-[var(--text-secondary)]">
    <span class="material-symbols-outlined">chevron_left</span>
    </button>
    <p class="text-[var(--text-primary)] text-base font-semibold">July 2024</p>
    <button class="p-2 rounded-full hover:bg-gray-100 text-[var(--text-secondary)]">
    <span class="material-symbols-outlined">chevron_right</span>
    </button>
    </div>
    <div class="grid grid-cols-7 gap-1 text-center">
    <p class="text-[var(--text-secondary)] text-xs font-medium">S</p>
    <p class="text-[var(--text-secondary)] text-xs font-medium">M</p>
    <p class="text-[var(--text-secondary)] text-xs font-medium">T</p>
    <p class="text-[var(--text-secondary)] text-xs font-medium">W</p>
    <p class="text-[var(--text-secondary)] text-xs font-medium">T</p>
    <p class="text-[var(--text-secondary)] text-xs font-medium">F</p>
    <p class="text-[var(--text-secondary)] text-xs font-medium">S</p>
    <div class="col-start-4"></div>
    <script>
                        for (let i = 1; i <= 30; i++) {
                          document.write(`
                            <button class="h-9 w-full text-sm font-medium rounded-full hover:bg-gray-100 ${i === 5 ? 'bg-[var(--primary-color)] text-[var(--text-primary)]' : 'text-[var(--text-primary)]'}">
                              ${i}
                            </button>
                          `);
                        }
                      </script>
    </div>
    </div>
    <div class="xl:col-span-2 bg-white p-4 rounded-xl border border-[var(--border-color)] shadow-sm">
    <h3 class="text-lg font-semibold text-[var(--text-primary)] mb-2">Legend</h3>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
    <div class="flex items-center gap-2">
    <div class="size-3 rounded-full bg-green-100 border border-green-300"></div>
    <span class="text-xs text-[var(--text-secondary)]">Available</span>
    </div>
    <div class="flex items-center gap-2">
    <div class="size-3 rounded-full bg-gray-200 border border-gray-400"></div>
    <span class="text-xs text-[var(--text-secondary)]">Past</span>
    </div>
    <div class="flex items-center gap-2">
    <div class="size-3 rounded-full bg-orange-100 border border-orange-300"></div>
    <span class="text-xs text-[var(--text-secondary)]">Draft</span>
    </div>
    <div class="flex items-center gap-2">
    <div class="size-3 rounded-full bg-blue-100 border border-blue-300"></div>
    <span class="text-xs text-[var(--text-secondary)]">Confirmed</span>
    </div>
    <div class="flex items-center gap-2">
    <div class="size-3 rounded-full bg-red-100 border border-red-300"></div>
    <span class="text-xs text-[var(--text-secondary)]">Rejected/Blocked</span>
    </div>
    </div>
    </div>
    </div>
    <div class="overflow-x-auto rounded-xl border border-[var(--border-color)] bg-white shadow-sm">
    <table class="min-w-full divide-y divide-[var(--border-color)]">
    <thead class="bg-gray-50">
    <tr>
    <th class="sticky left-0 bg-gray-50 z-10 px-4 py-3.5 text-left text-xs font-semibold text-[var(--text-primary)] sm:w-32" scope="col">Time</th>
    <th class="px-3 py-3.5 text-center text-xs font-semibold text-[var(--text-primary)]" scope="col">Mon, Jul 1</th>
    <th class="px-3 py-3.5 text-center text-xs font-semibold text-[var(--text-primary)]" scope="col">Tue, Jul 2</th>
    <th class="px-3 py-3.5 text-center text-xs font-semibold text-[var(--text-primary)]" scope="col">Wed, Jul 3</th>
    <th class="px-3 py-3.5 text-center text-xs font-semibold text-[var(--text-primary)]" scope="col">Thu, Jul 4</th>
    <th class="px-3 py-3.5 text-center text-xs font-semibold text-[var(--text-primary)]" scope="col">Fri, Jul 5</th>
    <th class="px-3 py-3.5 text-center text-xs font-semibold text-[var(--text-primary)]" scope="col">Sat, Jul 6</th>
    <th class="px-3 py-3.5 text-center text-xs font-semibold text-[var(--text-primary)]" scope="col">Sun, Jul 7</th>
    </tr>
    </thead>
    <tbody class="divide-y divide-[var(--border-color)] bg-white">
    <script>
                        const startTime = 2 * 60; // 2 AM in minutes
                        const endTime = 16 * 60; // 4 PM in minutes
                        const interval = 15; // 15 minutes
                        for (let time = startTime; time <= endTime; time += interval) {
                          const hours = Math.floor(time / 60);
                          const minutes = time % 60;
                          const ampm = hours >= 12 ? 'PM' : 'AM';
                          const displayHours = hours % 12 === 0 ? 12 : hours % 12;
                          const displayMinutes = minutes < 10 ? '0' + minutes : minutes;
                          const timeString = `${displayHours}:${displayMinutes} ${ampm}`;
                          let rowHtml = `<tr class="hover:bg-gray-50 transition-colors">
                            <td class="sticky left-0 bg-white whitespace-nowrap px-4 py-2.5 text-xs font-medium text-[var(--text-secondary)]">${timeString}</td>`;
                          const slotTypes = ['available', 'past', 'draft', 'confirmed', 'rejected'];
                          const slotTexts = {
                            available: 'Available',
                            past: 'Past Event',
                            draft: 'Draft: UX Workshop',
                            confirmed: 'Confirmed: Design Sprint',
                            rejected: 'Blocked',
                          };
                          for (let day = 0; day < 7; day++) {
                            // Randomly assign a slot type for demonstration
                            const randomSlotType = slotTypes[Math.floor(Math.random() * slotTypes.length)];
                            const slotClass = `slot-${randomSlotType}`;
                            const slotText = slotTexts[randomSlotType] || 'Status';
                            // Example: some slots are past, others are available or booked
                            let currentSlotClass = 'slot-available';
                            let currentSlotText = 'Available';
                            if (hours < 8 && day < 2) { // Example: past slots
                                currentSlotClass = 'slot-past';
                                currentSlotText = 'Past';
                            } else if (hours === 9 && day === 2) {
                                currentSlotClass = 'slot-draft';
                                currentSlotText = 'Draft: UI Review';
                            } else if (hours === 10 && day === 3) {
                                currentSlotClass = 'slot-confirmed';
                                currentSlotText = 'Confirmed: Coding Session';
                            } else if (hours === 14 && day === 0) {
                               currentSlotClass = 'slot-rejected';
                               currentSlotText = 'Not Available';
                            }
                            rowHtml += `<td class="whitespace-nowrap px-2 py-2.5 text-xs text-center">
                                          <button class="w-full h-full p-1.5 rounded-md text-xs font-medium transition-all duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-opacity-50 ${currentSlotClass} hover:opacity-80 focus:ring-blue-400">
                                            ${currentSlotText}
                                          </button>
                                        </td>`;
                          }
                          rowHtml += `</tr>`;
                          document.write(rowHtml);
                        }
                      </script>
    </tbody>
    </table>
    </div>
    </div>
    </main>
    </div>
    </div>
    
    </body></html>
